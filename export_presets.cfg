; Export presets for INANNA: SEVEN GATES.
;
; Committed on purpose. This file is usually gitignored because mobile
; presets can carry signing credentials; the Web preset carries none, and
; keeping it in the repository is what makes the browser build reproducible
; by anyone who checks the project out.
;
; The one setting that matters most is variant/thread_support=false.
; Multi-threaded web builds need SharedArrayBuffer, which requires full
; cross-origin isolation (COOP/COEP response headers) that GitHub Pages
; cannot send. Single-threaded export has been the Godot default since 4.3
; precisely to avoid that, and this project has no need of threads.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="build/*, tools/*, tests/*, docs/*"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.043, 0.035, 0.055, 1)
